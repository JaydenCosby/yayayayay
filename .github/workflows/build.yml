name: Build RadioSim VST3
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S RadioSim/RadioSim -B build
      - run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: RadioSim-VST3-windows
          path: build/RadioSim_artefacts/Release/VST3/RadioSim.vst3
